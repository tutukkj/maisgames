server {
    listen 80;
    listen [::]:80;

    server_name seu-dominio.com www.seu-dominio.com;
    root /var/www/maisgames;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location ~* \.(?:png|jpg|jpeg|webp|gif|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://images.unsplash.com data:; connect-src 'self'; frame-ancestors 'self';" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
}
